spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.stockpilot: INFO
    org.springframework.security: WARN
  file:
    name: logs/app.log

springdoc:
  swagger-ui:
    enabled: false
