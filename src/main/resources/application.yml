spring:
  application:
    name: stockpilot-inventory

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  name: StockPilot
  version: 1.0.0

  jwt:
    secret: ${JWT_SECRET:veryLongSecretKeyForJWTTokenGeneration2024StockPilotInventoryManagementSystemSecureKey}
    access-token-expiry: 86400000
    refresh-token-expiry: 604800000

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

  upload:
    dir: ./uploads
    max-size: 10485760
    allowed-types: image/jpeg,image/png,image/webp,application/pdf

  invoice:
    prefix: INV
    company-name: StockPilot Platform

  platform:
    admin-email: ${APP_PLATFORM_ADMIN_EMAIL:admin@stockpilot.com}
    admin-password: ${APP_PLATFORM_ADMIN_PASSWORD:Admin@123456}